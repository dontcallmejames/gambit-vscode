name: verify

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run for the same ref when a new commit lands.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The suite is Windows-coupled by design: many tests assert the Windows CLI
    # resolution path (where.exe, native .exe / npm-shim paths, D:\ paths,
    # process.platform 'win32'). They fail on Linux, so run verify on the OS the
    # verify script actually supports. (Cross-platform-izing those ~29 tests is a
    # separate effort, not a CI-bootstrap concern.)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match package.json engines (node >=20); 20 is the minimum supported.
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Full gate: typecheck + unit tests + build + package dry-run +
      # integration tests + a whitespace check. Same command run locally.
      - name: Verify
        run: npm run verify
